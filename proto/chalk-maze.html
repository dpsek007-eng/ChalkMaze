<title>분필 미로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">

<style>
:root{
  --void:#0B0A0C;
  --stone:#1C1A21;
  --stone-lit:#3A3542;
  --chalk:#E8E3D6;
  --ash:#6E6875;
  --relic:#7C7490;
  --ember:#FF7A3D;
  --ember-dim:#8A4526;
  --fire:#F2A33C;
  --moss:#4ADE9A;

  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  background:var(--void);
  color:var(--chalk);
  font-family:var(--body);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--void)}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:14px;padding:13px 16px 9px;flex:0 0 auto;z-index:3}

.where{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.where-lv{
  font-family:var(--display);font-size:18px;line-height:1;
  color:var(--chalk);white-space:nowrap;
}
.where-lv span{color:var(--ash);font-style:italic}
.fires{display:flex;gap:3.5px;align-items:center;min-height:8px}
.fire-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--stone-lit);
  transition:background-color .25s,box-shadow .25s;
}
.fire-dot.lit{background:var(--fire);box-shadow:0 0 7px rgba(242,163,60,.75)}

.torch{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.torch-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ash);
}
.torch-row b{
  font-weight:600;font-size:12px;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;color:var(--ember);
  transition:color .3s;
}
.torch-row b.low{color:#FF4D4D}
.torch-bar{height:3px;border-radius:2px;background:var(--stone);overflow:hidden}
.torch-fill{
  height:100%;width:100%;background:var(--ember);transform-origin:left center;
  transition:transform .18s ease-out,background-color .3s;
}
.torch-fill.low{background:#FF4D4D}

.pips{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:0 0 auto}
.pips-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.pips-row{display:flex;gap:4px;align-items:center;min-height:9px}
.pip{width:7px;height:9px;border-radius:1.5px;background:var(--chalk);box-shadow:0 0 6px rgba(232,227,214,.35)}
.pip.spent{background:var(--stone-lit);box-shadow:none}

/* ---------- 캔버스 ---------- */
#stage{flex:1 1 auto;min-height:0;display:block;width:100%;touch-action:none}

/* ---------- 조작부 ---------- */
.controls{
  flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
  padding:8px 20px 22px;gap:16px;z-index:3;
}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:3px}
.dpad button{
  border:1px solid var(--stone-lit);background:rgba(28,26,33,.55);color:var(--ash);
  border-radius:7px;font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--body);
  transition:background-color .1s,color .1s,border-color .1s;
}
.dpad button:active{background:var(--ember);color:var(--void);border-color:var(--ember)}
.dpad .up{grid-area:1/2} .dpad .lf{grid-area:2/1}
.dpad .rt{grid-area:2/3} .dpad .dn{grid-area:3/2}

.chalk-btns{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.chalk-btns button{
  display:flex;align-items:center;gap:9px;padding:9px 13px;
  border:1px solid var(--stone-lit);background:rgba(28,26,33,.55);
  border-radius:8px;color:var(--chalk);
  font-family:var(--body);font-size:12px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:border-color .12s,opacity .12s;
}
.chalk-btns button:active:not(:disabled){border-color:var(--chalk)}
.chalk-btns button:disabled{opacity:.3;cursor:default}
.chalk-btns .glyph{font-family:var(--mono);font-size:14px;font-weight:600;width:15px;text-align:center}

button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* ---------- 오버레이 ---------- */
.overlay{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:28px;background:rgba(11,10,12,.93);backdrop-filter:blur(3px);
}
.overlay[hidden]{display:none}
.card{max-width:340px;width:100%}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ember);margin-bottom:12px;
}
.eyebrow.warm{color:var(--fire)}
.card h1{
  font-family:var(--display);font-size:44px;line-height:1.02;font-weight:400;
  text-wrap:balance;letter-spacing:-.01em;margin-bottom:16px;
}
.card h1 em{font-style:italic;color:var(--ember)}
.card h1 em.warm{color:var(--fire)}
.card p{font-size:14px;line-height:1.62;color:var(--ash);margin-bottom:22px;max-width:62ch}
.card p strong{color:var(--chalk);font-weight:500}

.rules{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.rules li{display:grid;grid-template-columns:20px 1fr;gap:11px;align-items:baseline;font-size:13.5px;line-height:1.5;color:var(--ash)}
.rules .mk{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ember);text-align:center}
.rules .mk.warm{color:var(--fire)}
.rules b{color:var(--chalk);font-weight:600}

.stats{display:flex;gap:24px;margin-bottom:26px;padding:16px 0;border-top:1px solid var(--stone);border-bottom:1px solid var(--stone)}
.stat{display:flex;flex-direction:column;gap:5px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--chalk);line-height:1}

.go{
  width:100%;padding:14px;border:none;border-radius:9px;
  background:var(--ember);color:var(--void);
  font-family:var(--body);font-size:14px;font-weight:600;letter-spacing:.02em;cursor:pointer;
}
.hint{margin-top:14px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ash)}

/* 화톳불 점화 토스트 */
.toast{
  position:absolute;left:50%;top:22%;transform:translateX(-50%);
  z-index:6;pointer-events:none;text-align:center;white-space:nowrap;
}
.toast[hidden]{display:none}
.toast .t1{
  font-family:var(--display);font-size:30px;color:var(--fire);
  text-shadow:0 0 22px rgba(242,163,60,.55);
}
.toast .t2{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ash);margin-top:6px;
}
@keyframes toastIn{
  0%{opacity:0;transform:translateX(-50%) translateY(9px)}
  16%{opacity:1;transform:translateX(-50%) translateY(0)}
  76%{opacity:1}
  100%{opacity:0}
}
.toast.run{animation:toastIn 2.1s ease-out forwards}

@media (max-height:640px){
  .card h1{font-size:34px}
  .rules{gap:8px;margin-bottom:18px}
  .dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,36px)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
  .toast.run{animation-duration:.01ms}
}
</style>

<div id="app">
  <header class="hud">
    <div class="where">
      <div class="where-lv">층 <b id="lv">1</b> <span id="runs">· 1회차</span></div>
      <div class="fires" id="fires"></div>
    </div>
    <div class="torch">
      <div class="torch-row"><span>횃불</span><b id="fuel">45</b></div>
      <div class="torch-bar"><div class="torch-fill" id="fuelbar"></div></div>
    </div>
    <div class="pips">
      <div class="pips-label">분필</div>
      <div class="pips-row" id="pips"></div>
    </div>
  </header>

  <canvas id="stage"></canvas>

  <div class="toast" id="toast" hidden>
    <div class="t1" id="toast1"></div>
    <div class="t2" id="toast2"></div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="up" data-dir="0" aria-label="위로">▲</button>
      <button class="lf" data-dir="3" aria-label="왼쪽">◀</button>
      <button class="rt" data-dir="1" aria-label="오른쪽">▶</button>
      <button class="dn" data-dir="2" aria-label="아래로">▼</button>
    </div>
    <div class="chalk-btns">
      <button id="mkA"><span class="glyph">↑</span>지나간 방향</button>
      <button id="mkX"><span class="glyph">✕</span>막다른 길</button>
    </div>
  </div>

  <div class="overlay" id="ov"><div class="card" id="card"></div></div>
</div>

<script>
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── 층 설계 ──────────────────────────────────────── */
function levelCfg(L){
  const n     = Math.min(9 + 2*(L-1), 21);
  const fuel  = Math.round(n*n*0.42);          // 화톳불이 생겨서 회차당 연료는 줄임
  const chalk = Math.max(3, 7 - Math.floor((L-1)/2));
  const braid = Math.floor(n*0.6);
  const fires = n<=11 ? 2 : 3;
  return {n, fuel, chalk, braid, fires};
}

const DIRS = [[0,-1,"n","s"],[1,0,"e","w"],[0,1,"s","n"],[-1,0,"w","e"]];

function genMaze(n, braid){
  const c=[];
  for(let y=0;y<n;y++){ const r=[]; for(let x=0;x<n;x++) r.push({n:1,e:1,s:1,w:1,v:0}); c.push(r); }
  const st=[[0,0]]; c[0][0].v=1;
  while(st.length){
    const [x,y]=st[st.length-1];
    const opts=DIRS.filter(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      return nx>=0&&ny>=0&&nx<n&&ny<n&&!c[ny][nx].v;
    });
    if(!opts.length){ st.pop(); continue; }
    const [dx,dy,a,b]=opts[(Math.random()*opts.length)|0];
    const nx=x+dx, ny=y+dy;
    c[y][x][a]=0; c[ny][nx][b]=0; c[ny][nx].v=1; st.push([nx,ny]);
  }
  for(let i=0;i<braid;i++){
    const x=1+((Math.random()*(n-2))|0), y=1+((Math.random()*(n-2))|0);
    const [dx,dy,a,b]=DIRS[(Math.random()*4)|0];
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=n||ny>=n) continue;
    c[y][x][a]=0; c[ny][nx][b]=0;
  }
  return c;
}

// 시작점 기준 거리 지도
function distMap(c,n,sx,sy){
  const d=Array.from({length:n},()=>new Array(n).fill(-1));
  d[sy][sx]=0; const q=[[sx,sy]];
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];
    for(const [dx,dy,a] of DIRS){
      if(c[y][x][a]) continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n||d[ny][nx]>=0) continue;
      d[ny][nx]=d[y][x]+1; q.push([nx,ny]);
    }
  }
  return d;
}

/* ── 상태 ─────────────────────────────────────────── */
const G = {
  L:1, n:0, cells:null, exit:[0,0],
  px:0, py:0, camx:0, camy:0,
  spawn:[0,0],
  fires:[], landmarks:new Map(),
  fuel:0, fuelMax:0,
  chalkMax:0, marks:new Map(),
  lastDir:2, runs:1, steps:0,
  mode:"intro", vis:new Set(),
  shake:0,
};
const key=(x,y)=>y*G.n+x;

function loadLevel(L){
  const cfg=levelCfg(L);
  G.L=L; G.n=cfg.n;
  G.cells=genMaze(cfg.n,cfg.braid);

  const d=distMap(G.cells,cfg.n,0,0);
  let maxD=0, exitCell=[0,0];
  for(let y=0;y<cfg.n;y++)for(let x=0;x<cfg.n;x++)
    if(d[y][x]>maxD){ maxD=d[y][x]; exitCell=[x,y]; }
  G.exit=exitCell;

  // 화톳불 : 출발점과 출구 사이에 고르게
  const fr = cfg.fires===2 ? [0.36,0.68] : [0.28,0.52,0.76];
  const taken=new Set([key(0,0),key(exitCell[0],exitCell[1])]);
  G.fires=[];
  for(const f of fr){
    const want=maxD*f;
    let best=null, bestErr=1e9;
    for(let y=0;y<cfg.n;y++)for(let x=0;x<cfg.n;x++){
      if(d[y][x]<0||taken.has(key(x,y))) continue;
      const err=Math.abs(d[y][x]-want);
      if(err<bestErr){ bestErr=err; best=[x,y]; }
    }
    if(best){ taken.add(key(best[0],best[1])); G.fires.push({x:best[0],y:best[1],lit:false}); }
  }

  // 랜드마크 : 기억이 붙을 자리 (분필을 안 써도 되는 단서)
  G.landmarks=new Map();
  const total=cfg.n*cfg.n, want=Math.round(total*0.13);
  let guard=0;
  while(G.landmarks.size<want && guard++<total*6){
    const x=(Math.random()*cfg.n)|0, y=(Math.random()*cfg.n)|0;
    const k=key(x,y);
    if(taken.has(k)||G.landmarks.has(k)) continue;
    G.landmarks.set(k,(Math.random()*4)|0);
  }

  G.fuelMax=cfg.fuel; G.chalkMax=cfg.chalk;
  G.marks=new Map(); G.runs=1; G.steps=0; G.spawn=[0,0];
  respawn();
}

function respawn(){
  G.px=G.spawn[0]; G.py=G.spawn[1];
  G.camx=G.px; G.camy=G.py;
  G.fuel=G.fuelMax; G.lastDir=2;
  recomputeVis(); syncHud();
}

function recomputeVis(){
  const v=new Set([key(G.px,G.py)]);
  for(const [dx,dy,w] of DIRS){
    let x=G.px, y=G.py;
    for(let i=0;i<64;i++){
      if(G.cells[y][x][w]) break;
      x+=dx; y+=dy;
      if(x<0||y<0||x>=G.n||y>=G.n) break;
      v.add(key(x,y));
    }
  }
  G.vis=v;
}

/* ── 이동 ─────────────────────────────────────────── */
function move(di){
  if(G.mode!=="play") return;
  const [dx,dy,a]=DIRS[di];
  if(G.cells[G.py][G.px][a]) return;
  const nx=G.px+dx, ny=G.py+dy;
  if(nx<0||ny<0||nx>=G.n||ny>=G.n) return;

  G.px=nx; G.py=ny; G.lastDir=di; G.fuel--; G.steps++;
  recomputeVis();

  if(nx===G.exit[0] && ny===G.exit[1]){ G.mode="win"; showWin(); return; }

  // 화톳불 점화 : 연료 만충 + 부활 지점 이동
  const f=G.fires.find(f=>!f.lit && f.x===nx && f.y===ny);
  if(f){
    f.lit=true; G.spawn=[nx,ny]; G.fuel=G.fuelMax; G.shake=1;
    toast("화톳불을 밝혔다", "여기서 다시 시작합니다 · 횃불 회복");
    syncHud(); return;
  }

  if(G.fuel<=0){ G.mode="dead"; showDead(); return; }
  syncHud();
}

function mark(type){
  if(G.mode!=="play") return;
  const k=key(G.px,G.py), ex=G.marks.get(k);
  if(ex && ex.t===type){ G.marks.delete(k); syncHud(); return; }
  if(!ex && G.marks.size>=G.chalkMax) return;
  G.marks.set(k,{t:type,d:G.lastDir});
  syncHud();
}

/* ── HUD ──────────────────────────────────────────── */
const $=(s)=>document.querySelector(s);
const elLv=$("#lv"), elRuns=$("#runs"), elFuel=$("#fuel"), elBar=$("#fuelbar"),
      elPips=$("#pips"), elFires=$("#fires"), elMkA=$("#mkA"), elMkX=$("#mkX");

function syncHud(){
  elLv.textContent=G.L;
  elRuns.textContent="· "+G.runs+"회차";
  elFuel.textContent=Math.max(0,G.fuel);
  const r=Math.max(0,G.fuel)/G.fuelMax, low=r<0.25;
  elBar.style.transform="scaleX("+r+")";
  elBar.classList.toggle("low",low);
  elFuel.classList.toggle("low",low);

  if(elFires.children.length!==G.fires.length){
    elFires.innerHTML="";
    G.fires.forEach(()=>elFires.appendChild(Object.assign(document.createElement("i"),{className:"fire-dot"})));
  }
  [...elFires.children].forEach((d,i)=>d.classList.toggle("lit",G.fires[i].lit));

  if(elPips.children.length!==G.chalkMax){
    elPips.innerHTML="";
    for(let i=0;i<G.chalkMax;i++) elPips.appendChild(Object.assign(document.createElement("i"),{className:"pip"}));
  }
  const used=G.marks.size;
  [...elPips.children].forEach((p,i)=>p.classList.toggle("spent",i<used));

  const here=G.marks.get(key(G.px,G.py)), full=used>=G.chalkMax;
  elMkA.disabled = G.mode!=="play" || (full && !(here&&here.t==="a"));
  elMkX.disabled = G.mode!=="play" || (full && !(here&&here.t==="x"));
}

/* ── 토스트 ───────────────────────────────────────── */
const elToast=$("#toast"), elT1=$("#toast1"), elT2=$("#toast2");
let toastTimer=0;
function toast(a,b){
  elT1.textContent=a; elT2.textContent=b;
  elToast.hidden=false; elToast.classList.remove("run");
  void elToast.offsetWidth;
  elToast.classList.add("run");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{elToast.hidden=true;},2100);
}

/* ── 렌더 ─────────────────────────────────────────── */
const cv=$("#stage"), cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);

const C={chalk:"#E8E3D6",stoneLit:"#3A3542",ember:"#FF7A3D",
         fire:"#F2A33C",moss:"#4ADE9A",relic:"#7C7490"};

// 랜드마크 4종 — 기둥 / 웅덩이 / 버섯 / 균열
function drawRelic(t,gx,gy,cs){
  cx.strokeStyle=C.relic; cx.fillStyle=C.relic;
  cx.lineWidth=Math.max(1.5,cs*0.055); cx.lineCap="round";
  const s=cs*0.2;
  if(t===0){
    cx.beginPath();
    cx.moveTo(gx-s*0.55,gy+s); cx.lineTo(gx-s*0.55,gy-s*0.5);
    cx.moveTo(gx+s*0.55,gy+s); cx.lineTo(gx+s*0.55,gy-s);
    cx.stroke();
  }else if(t===1){
    cx.beginPath(); cx.ellipse(gx,gy+s*0.15,s*1.05,s*0.55,0,0,7); cx.stroke();
    cx.globalAlpha=.35; cx.beginPath(); cx.ellipse(gx,gy+s*0.15,s*0.5,s*0.26,0,0,7); cx.fill(); cx.globalAlpha=1;
  }else if(t===2){
    cx.beginPath(); cx.arc(gx,gy-s*0.1,s*0.72,Math.PI,0); cx.fill();
    cx.beginPath(); cx.moveTo(gx,gy-s*0.1); cx.lineTo(gx,gy+s*0.85); cx.stroke();
  }else{
    cx.beginPath();
    cx.moveTo(gx-s*0.6,gy-s); cx.lineTo(gx+s*0.25,gy-s*0.2);
    cx.lineTo(gx-s*0.3,gy+s*0.25); cx.lineTo(gx+s*0.55,gy+s);
    cx.stroke();
  }
}

function draw(t){
  requestAnimationFrame(draw);
  if(!G.cells||!W) return;

  const k = RM ? 1 : 0.22;
  G.camx += (G.px-G.camx)*k;
  G.camy += (G.py-G.camy)*k;

  const cs = Math.max(30, Math.min(W,H)/8.4);
  let sh=0;
  if(G.shake>0){ G.shake*=0.88; if(G.shake<0.02)G.shake=0; sh=RM?0:G.shake*cs*0.055; }
  const jx=sh?(Math.random()-0.5)*sh:0, jy=sh?(Math.random()-0.5)*sh:0;

  const ox = W/2-(G.camx+0.5)*cs+jx, oy = H/2-(G.camy+0.5)*cs+jy;
  const cxp = W/2+jx, cyp = H/2+jy;

  cx.fillStyle="#0B0A0C"; cx.fillRect(0,0,W,H);

  cx.fillStyle="#171520";
  for(const k2 of G.vis){
    const x=k2%G.n, y=(k2/G.n)|0;
    cx.fillRect(ox+x*cs+1, oy+y*cs+1, cs-2, cs-2);
  }

  cx.strokeStyle=C.stoneLit;
  cx.lineWidth=Math.max(2,cs*0.075); cx.lineCap="round";
  cx.beginPath();
  for(const k2 of G.vis){
    const x=k2%G.n, y=(k2/G.n)|0, c=G.cells[y][x];
    const l=ox+x*cs, tp=oy+y*cs, r=l+cs, b=tp+cs;
    if(c.n){cx.moveTo(l,tp);cx.lineTo(r,tp);}
    if(c.s){cx.moveTo(l,b);cx.lineTo(r,b);}
    if(c.w){cx.moveTo(l,tp);cx.lineTo(l,b);}
    if(c.e){cx.moveTo(r,tp);cx.lineTo(r,b);}
  }
  cx.stroke();

  // 랜드마크 (시야 안에서만)
  for(const [k2,type] of G.landmarks){
    if(!G.vis.has(k2)) continue;
    const x=k2%G.n, y=(k2/G.n)|0;
    drawRelic(type, ox+x*cs+cs/2, oy+y*cs+cs/2, cs);
  }

  // 출구
  const [ex,ey]=G.exit;
  if(G.vis.has(key(ex,ey))){
    const gx=ox+ex*cs+cs/2, gy=oy+ey*cs+cs/2;
    const g=cx.createRadialGradient(gx,gy,0,gx,gy,cs*0.9);
    g.addColorStop(0,"rgba(74,222,154,.55)"); g.addColorStop(1,"rgba(74,222,154,0)");
    cx.fillStyle=g; cx.fillRect(gx-cs,gy-cs,cs*2,cs*2);
    cx.fillStyle=C.moss; cx.fillRect(gx-cs*0.17,gy-cs*0.17,cs*0.34,cs*0.34);
  }

  // 꺼진 화톳불 : 시야 안에서만
  for(const f of G.fires){
    if(f.lit || !G.vis.has(key(f.x,f.y))) continue;
    const gx=ox+f.x*cs+cs/2, gy=oy+f.y*cs+cs/2;
    cx.strokeStyle="#5A4A3A"; cx.lineWidth=Math.max(1.5,cs*0.05);
    cx.beginPath(); cx.arc(gx,gy,cs*0.2,0,7); cx.stroke();
  }

  // 횃불 감쇠 — 연료가 줄수록 시야가 좁아지고 붉어진다
  const rr = Math.max(0,G.fuel)/G.fuelMax;
  const flick = RM ? 1 : 1+Math.sin(t/190)*0.028+Math.sin(t/71)*0.016;
  const reach = cs*4.6*flick*(0.34+0.66*rr);
  const panic = rr<0.25 ? (0.25-rr)/0.25 : 0;
  const vg=cx.createRadialGradient(cxp,cyp,cs*0.4,cxp,cyp,reach);
  vg.addColorStop(0,"rgba(11,10,12,0)");
  vg.addColorStop(0.55,"rgba(11,10,12,.42)");
  vg.addColorStop(1,"rgba(11,10,12,.97)");
  cx.fillStyle=vg; cx.fillRect(0,0,W,H);
  if(panic>0){
    const pv=cx.createRadialGradient(cxp,cyp,reach*0.5,cxp,cyp,Math.max(W,H)*0.75);
    pv.addColorStop(0,"rgba(120,20,20,0)");
    pv.addColorStop(1,"rgba(120,20,20,"+(0.42*panic).toFixed(3)+")");
    cx.fillStyle=pv; cx.fillRect(0,0,W,H);
  }

  // 점화된 화톳불 : 어둠 너머에서도 보인다 — 등대이자 나침반
  for(const f of G.fires){
    if(!f.lit) continue;
    const gx=ox+f.x*cs+cs/2, gy=oy+f.y*cs+cs/2;
    if(gx<-cs*2||gy<-cs*2||gx>W+cs*2||gy>H+cs*2) continue;
    const dist=Math.hypot(gx-cxp,gy-cyp)/(cs*9);
    const a=Math.max(0.3,1-dist);
    const pulse=RM?1:1+Math.sin(t/300+f.x)*0.09;
    const g=cx.createRadialGradient(gx,gy,0,gx,gy,cs*1.5*pulse);
    g.addColorStop(0,"rgba(242,163,60,"+(0.62*a).toFixed(3)+")");
    g.addColorStop(1,"rgba(242,163,60,0)");
    cx.fillStyle=g; cx.fillRect(gx-cs*2,gy-cs*2,cs*4,cs*4);
    cx.globalAlpha=a; cx.fillStyle=C.fire;
    cx.beginPath(); cx.arc(gx,gy,cs*0.13*pulse,0,7); cx.fill();
    cx.globalAlpha=1;
  }

  // 분필 자국
  cx.textAlign="center"; cx.textBaseline="middle";
  for(const [k2,m] of G.marks){
    if(!G.vis.has(k2)) continue;
    const x=k2%G.n, y=(k2/G.n)|0;
    const gx=ox+x*cs+cs/2, gy=oy+y*cs+cs/2;
    const dist=Math.hypot(gx-cxp,gy-cyp)/(cs*7);
    cx.globalAlpha=Math.max(0.34,1-dist);
    cx.fillStyle=C.chalk;
    if(m.t==="x"){
      cx.font="600 "+(cs*0.44)+"px ui-monospace,monospace";
      cx.fillText("✕",gx,gy+cs*0.02);
    }else{
      cx.save(); cx.translate(gx,gy); cx.rotate(m.d*Math.PI/2);
      cx.beginPath();
      cx.moveTo(0,-cs*0.19); cx.lineTo(cs*0.13,cs*0.07);
      cx.lineTo(0,cs*0.005); cx.lineTo(-cs*0.13,cs*0.07);
      cx.closePath(); cx.fill(); cx.restore();
    }
    cx.globalAlpha=1;
  }

  // 플레이어
  const pg=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,cs*0.85);
  pg.addColorStop(0,"rgba(255,122,61,.5)"); pg.addColorStop(1,"rgba(255,122,61,0)");
  cx.fillStyle=pg; cx.fillRect(cxp-cs,cyp-cs,cs*2,cs*2);
  cx.fillStyle=C.ember;
  cx.beginPath(); cx.arc(cxp,cyp,cs*0.15,0,7); cx.fill();
}

/* ── 오버레이 ─────────────────────────────────────── */
const ov=$("#ov"), card=$("#card");
function show(html){ card.innerHTML=html; ov.hidden=false; }
function hide(){ ov.hidden=true; }

function showIntro(){
  G.mode="intro";
  show(`
    <div class="eyebrow">프로토타입 · v0.2</div>
    <h1>분필 <em>미로</em></h1>
    <p>횃불은 <strong>정해진 걸음 수</strong>만큼만 탑니다. 지나온 길은 다시 어두워지고,
       <strong>남는 건 분필 자국과 화톳불뿐</strong>입니다.</p>
    <ul class="rules">
      <li><span class="mk warm">◉</span><b>화톳불</b> — 밝히면 여기서 부활합니다. 횃불도 가득 찹니다. <b>어둠 너머에서도 보입니다.</b></li>
      <li><span class="mk">↑</span><b>지나간 방향</b> — 이 갈림길에서 어디로 갔었는지</li>
      <li><span class="mk">✕</span><b>막다른 길</b> — 여긴 두 번 오지 마라</li>
      <li><span class="mk">◈</span>기둥·웅덩이·버섯 같은 <b>지형지물은 공짜 단서</b>입니다. 분필을 아끼세요.</li>
    </ul>
    <button class="go" id="btn">내려가기</button>
    <div class="hint">스와이프 · 방향키 · D-패드</div>
  `);
  $("#btn").onclick=()=>{ hide(); G.mode="play"; syncHud(); };
}

function showDead(){
  syncHud();
  const lit=G.fires.filter(f=>f.lit).length;
  const at = lit>0 ? "마지막으로 밝힌 <strong>화톳불</strong>에서" : "<strong>입구</strong>에서";
  show(`
    <div class="eyebrow">횃불이 꺼졌다</div>
    <h1>어둠 속에 <em>남다</em></h1>
    <p>${at} 다시 시작합니다. 분필 자국 ${G.marks.size}개와 밝힌 화톳불 ${lit}개는 그대로입니다.</p>
    <div class="stats">
      <div class="stat"><span class="k">회차</span><span class="v">${G.runs}</span></div>
      <div class="stat"><span class="k">총 걸음</span><span class="v">${G.steps}</span></div>
      <div class="stat"><span class="k">화톳불</span><span class="v">${lit}/${G.fires.length}</span></div>
    </div>
    <button class="go" id="btn">다시 들어가기</button>
  `);
  $("#btn").onclick=()=>{ G.runs++; respawn(); hide(); G.mode="play"; };
}

function showWin(){
  syncHud();
  const next=levelCfg(G.L+1);
  show(`
    <div class="eyebrow warm">${G.L}층 돌파</div>
    <h1>출구를 <em class="warm">찾았다</em></h1>
    <p>다음은 <strong>${next.n}×${next.n}</strong> 미로, 분필 <strong>${next.chalk}개</strong>,
       화톳불 <strong>${next.fires}개</strong>.</p>
    <div class="stats">
      <div class="stat"><span class="k">회차</span><span class="v">${G.runs}</span></div>
      <div class="stat"><span class="k">총 걸음</span><span class="v">${G.steps}</span></div>
      <div class="stat"><span class="k">쓴 분필</span><span class="v">${G.marks.size}</span></div>
    </div>
    <button class="go" id="btn">${G.L+1}층으로</button>
  `);
  $("#btn").onclick=()=>{ loadLevel(G.L+1); hide(); G.mode="play"; };
}

/* ── 입력 ─────────────────────────────────────────── */
const KEYMAP={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
let held=null, rep=0;
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="Enter"){
    const b=$("#btn"); if(b&&!ov.hidden){ e.preventDefault(); b.click(); }
    return;
  }
  const d=KEYMAP[e.code]; if(d===undefined) return;
  e.preventDefault();
  if(held===d) return;
  held=d; move(d);
  clearInterval(rep); rep=setInterval(()=>move(d),135);
});
addEventListener("keyup",e=>{ if(KEYMAP[e.code]===held){ held=null; clearInterval(rep); } });

document.querySelectorAll(".dpad button").forEach(b=>{
  const d=+b.dataset.dir;
  const start=e=>{ e.preventDefault(); move(d); clearInterval(rep); rep=setInterval(()=>move(d),135); };
  const stop=()=>clearInterval(rep);
  b.addEventListener("pointerdown",start);
  b.addEventListener("pointerup",stop);
  b.addEventListener("pointerleave",stop);
  b.addEventListener("pointercancel",stop);
});

let sx=0,sy=0,sw=false;
cv.addEventListener("pointerdown",e=>{ sx=e.clientX; sy=e.clientY; sw=true; });
cv.addEventListener("pointerup",e=>{
  if(!sw) return; sw=false;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.hypot(dx,dy)<22) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx>0?1:3) : (dy>0?2:0));
});
cv.addEventListener("pointercancel",()=>sw=false);

elMkA.onclick=()=>mark("a");
elMkX.onclick=()=>mark("x");

resize();
loadLevel(1);
showIntro();
requestAnimationFrame(draw);
</script>
